# Environment for the multi-view (MDT) work added in this fork:
# experiments/gnn_mdt, experiments/graph_mdt, experiments/mvbench, tests/.
#
# Separate from environment.yml on purpose.  That file pins TensorFlow 2.17 on
# Python 3.10, which is what reproduces the original Deep Diffusion Maps
# results; this line of work is PyTorch on 3.13 and the two cannot share an
# environment (TF 2.17 has no 3.13 wheels).  The tensorflow env is still
# required for experiments/mvmat and experiments/helix_mv.
name: mdt
dependencies:
  - python == 3.13.5
  - pip
  - pip:
    - torch == 2.10.0
    - numpy == 2.4.2
    - scipy == 1.16.3
    - scikit-learn == 1.7.2
    - kneed == 0.8.6          # entropy-elbow diffusion time for ID / p-AD
    - PyYAML == 6.0.3
    - matplotlib == 3.10.7
    - pytest == 9.0.2
