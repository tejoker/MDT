data:
  path: /tmp/Multi-view-datasets
  name: Handwritten   # 2000 samples, 6 views, 10 classes
  split: 0.7
  seed: 0
  standardize: True
mdt:
  n_components: 10   # = number of clusters
  steps: 4
  method: contrastive
  knn: 7             # ~ log(1400 train)
  quantile: 0.5
  search: 20         # number of random trajectories to search over (CH-selected)
encoder:
  architecture:
    units: 256
    use_bn: True
  optimizer:
    learning_rate: 0.01
  training:
    epochs: 600
    batch_size: 500
    shuffle: True
    verbose: 0
output_dir: results
