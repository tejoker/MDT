data:
  path: /tmp/Multi-view-datasets
  name: Yale   # 2000 samples, 6 views, 10 classes
  split: 0.7
  seed: 0
  standardize: True
mdt:
  n_components: 15   # = number of clusters
  steps: 4
  method: contrastive
  knn: 5             # ~ log(1400 train)
  quantile: 0.5
encoder:
  architecture:
    units: 256
    use_bn: True
  optimizer:
    learning_rate: 0.01
  training:
    epochs: 600
    batch_size: 500
    shuffle: True
    verbose: 0
output_dir: results
